<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { background:#0a0e17; color:#fff; font-family:sans-serif; text-align:center; padding:20px; }
        input, button { width:100%; padding:10px; margin-top:10px; border-radius:5px; border:none; }
        button { background:#ff6600; color:#fff; cursor:pointer; }
        #area_grafico { margin-top:20px; }
    </style>
</head>
<body>
    <h3>Gráfico 3D</h3>
    <input id="funcao" type="text" placeholder="ex.: sin(sqrt(x**2 + y**2))">
    <button onclick="gerar()">Renderizar</button>
    <div id="area_grafico"></div>
    <button onclick="IsaacBridge.postMessage(JSON.stringify({'acao':'nav_interface','valor':'interface'}))">
        Voltar
    </button>

    <script>
        function gerar(){
            const f = document.getElementById('funcao').value;
            IsaacBridge.postMessage(JSON.stringify({'acao':'gerar_3d','valor':f}));
        }

        window.addEventListener('message', e=>{
            try{
                const data = JSON.parse(e.data);
                if(data.acao==='imagem_3d'){
                    const img = document.createElement('img');
                    img.src = 'data:image/png;base64,'+data.valor;
                    const area = document.getElementById('area_grafico');
                    area.innerHTML = '';
                    area.appendChild(img);
                }
            }catch{}
        });
    </script>
</body>
</html>
</body>
</html>
